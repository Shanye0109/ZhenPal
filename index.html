function filteredRows(p){let rows=recordsFor(p),q=(state.search[p.id]||'').trim().toLowerCase();if(q)rows=rows.filter(function(r){return r.values.join(' ').toLowerCase().indexOf(q)!==-1;});const sub=state.sub[p.id]||p.tabs[0];const statusPages=['admin-todos','admin-messages','admin-products','admin-requirements','admin-orders','admin-aftersales','admin-purchases','admin-dispatches','admin-sales-invoices','admin-purchase-invoices','admin-invoice-review','admin-costs','admin-price-todos','client-orders','client-invoices'];if(p.id==='client-logistics'&&sub!=='收货确认'){const normalize=function(v){return String(v).replace(/[／/\s]/g,'');};rows=rows.filter(function(r){return normalize(r.values[2])===normalize(sub);});}else if(p.id==='admin-missing-invoices'){rows=rows.filter(function(r){return r.values[3]===(sub==='缺进项票'?'进项发票':'销项发票');});}else if(sub&&statusPages.includes(p.id)&&!/^全部/.test(sub)){const key=sub==='配送中'?'部分交付':sub==='待人工核对'?'待核对':sub;rows=rows.filter(function(r){return r.values.some(function(v){return v.indexOf(key)!==-1;});});}return rows;}
function tableRows(p,rows){if(!rows.length)return '<tr><td colspan="'+(p.columns.length+1)+'"><div class="empty">'+icon('archive')+'<strong>暂无匹配的示例记录</strong><span>可切换分类或清空关键词查看页面布局。</span></div></td></tr>';return rows.map(function(r){return '<tr>'+r.values.map(function(v,j){return '<td>'+cell(v,p.columns[j],p)+'</td>';}).join('')+'<td><button class="table-action" data-detail="'+p.id+'" data-row="'+r.index+'">查看</button></td></tr>';}).join('');}
function tableMarkup(p,short){const rows=short?recordsFor(p):filteredRows(p);return '<div class="table-scroll"><table><thead><tr>'+p.columns.map(function(c){return '<th scope="col">'+esc(c)+'</th>';}).join('')+'<th scope="col">操作</th></tr></thead><tbody '+(short?'':'id="list-body"')+'>'+tableRows(p,rows)+'</tbody></table></div>'+(short?'':'<div class="table-footer"><span id="list-count">共 '+rows.length+' 条示例记录</span><div class="pagination"><button disabled aria-label="上一页">‹</button><button class="current" aria-current="page">1</button><button disabled aria-label="下一页">›</button><span>10 条 / 页</span></div></div>');}
function listToolbar(p){const special={ 'admin-products':'新增商品','admin-companies':'新增客户','admin-customer-accounts':'开通账号','admin-suppliers':'新增供应商','admin-purchases':'新增采购','admin-orders':'代录订单','admin-quotes':'新增报价','admin-sales-invoices':'上传发票','admin-purchase-invoices':'上传发票','admin-requirements':'新建需求','admin-dispatches':'新增配送','admin-self-delivery':'新增自配送','admin-expenses':'登记费用资料'};

}

if(p.id==='admin-missing-invoices')pre=note('缺票待办显示全部未处理业务，包括上月已完成、尚未补齐票据的订单。',true);

置"')+'</div></div></section><section class="panel"><div class="panel-head"><h2>配置说明</h2></div><div class="panel-body">'+(isPrice?'<p style="font-size:13px">检查后修改价格，重新进入 A 周期；人工确认保持原价，进入 B 周期。</p><p class="hint">仅查看、未处理或抓价失败不重置时间。首次计时事件仍需确认。</p>':'<p class="hint">本页面用于查看配置项的组织方式。表单修改仅停留在当前页面，保存操作显示预览提示。</p>')+notes(p)+linkButton('阅读对应需求',sourceHref(p),'book')+'</div></section></div>'+footer(p);}

function login(p){return '<section class="auth-card"><div class="brand-mark">ZP</div><h2>登录客户采购门户</h2><p>账号由管理员开通，自助注册暂未开放。</p><div class="field"><label for="login-user">用户名</label><input id="login-user" autocomplete="off" placeholder="此处仅展示登录样式"></div><div class="field"><label for="login-pass">密码</label><input id="login-pass" type="password" autocomplete="off" placeholder="请勿在预览页填写真实密码"></div>'+btn('登录','primary','data-demo="登录"')+'<div class="auth-footer"><button class="table-action" data-demo="找回密码">找回密码</button><a href="#client-register">注册说明</a></div></section>'+footer(p);}
function reserved(p){const registration=p.id==='client-register';return '<div class="reserved"><section class="reserved-hero"><div class="reserved-icon">'+icon(registration?'lock':p.groupIcon)+'</div><h2>'+(registration?'自助注册暂未开放':esc(p.label))+'</h2><p>'+esc(registration?'请联系管理员开通公司主账号。当前每个公司使用一个主账号，账号开通后可在允许的范围内修改资料。':p.summary)+'</p><div class="reserved-caption">'+(registration?'注册接口已列入规划，当前不提供自助提交入口。':'此入口用于展示完整规划范围，当前未启用。后续实施范围与规则以需求讨论结果为准。')+'</div>'+(p.tabs&&p.tabs.length?'<div class="planned-tabs">'+p.tabs.map(function(t,i){const a=(state.sub[p.id]||p.tabs[0])===t;return '<button data-sub="'+esc(t)+'" class="'+(a?'active':'')+'">'+esc(t)+'</button>';}).join('')+'</div><p class="hint">当前查看：'+esc(state.sub[p.id]||p.tabs[0])+' · 预留页面位置</p>':'')+notes(p)+'<div class="reserved-links">'+(registration?pageLink('返回登录','client-login'):pageLink('返回经营概览','admin-overview'))+linkButton('阅读规划说明',sourceHref(p),'book')+'</div></section></div>'+footer(p);}
function reports(p){return periodBar('按业务日期')+note('下单、采购、履约完成与开票分别按对应业务日期统计；利润口径仍待确认。',true)+'<div class="dashboard-columns"><section class="panel"><div class="panel-head"><h2>订单数量 · 示例趋势</h2><span class="hint">单位：单</span></div><div class="panel-body"><div class="mini-bars">'+[3,4,2,6,5,8].map(function(n,i){return '<div class="mini-bar" style="height:'+(n*12)+'px"><i>'+n+'</i><span>11.'+(i*2+1)+'</span></div>';}).join('')+'</div></div></section><section class="panel"><div class="panel-head"><h2>统计口径</h2></div><div class="panel-body"><div class="summary-row"><span>订单数量</span><span>按主订单计数</span></div><div class="summary-row"><span>采购记录</span><span>按实际采购业务日期</span></div><div class="summary-row"><span>发票资料</span><span>按实际开票日期</span></div><div class="summary-row"><span>利润数据</span>'+badge('口径待确认','amber')+'</div></div></section></div><section class="panel">'+listTabs(p)+listToolbar(p)+tableMarkup(p)+'</section>'+notes(p)+footer(p);}
function help(p){return '<div class="help-grid"><a class="help-link" href="readme.html">'+icon('book')+'<h2>完整需求文档 V2.1</h2><p>查看完整功能、页面地图、业务流程、20 项冲突对比及待确认问题。</p></a><a class="help-link" href="names.html">'+icon('sparkles')+'<h2>五组产品名称备选</h2><p>臻伙伴、臻合、臻好办、臻序、臻采。比较含义、优点和不足，便于讨论。</p></a></div><section class="panel help-accordion"><details open><summary>本页面可以做什么？</summary><p>查看全部菜单、切换管理端与客户端、打开工作标签、筛选示例记录，以及预览需求表单、报价和多购物袋。全部数据仅用于页面展示。</p></details><details><summary>规划预留为什么单独显示？</summary><p>常购、合同、公司子账号、供应商入驻及库存等尚未启用。独立的规划视图便于评审全部菜单，同时保留当前与后续范围的区别。</p></details><details><summary>为什么没有在线支付与收付款菜单？</summary><p>V2.1 明确线下公对公转账在系统外完成。这里保留订单、成本、费用资料和票据管理，没有独立资金流水。</p></details></section><section class="panel" style="margin-top:20px"><div class="panel-head"><h2>完整菜单索引</h2><span class="hint">'+pages.length+' 个页面入口</span></div><div class="panel-body menu-map">'+scopes.map(function(s){return s.groups.map(function(g){return '<div class="map-group"><h3>'+esc(s.label)+' · '+esc(g.label)+'</h3>'+g.pages.map(function(x){return '<a href="#'+x.id+'">'+esc(x.label)+'</a>';}).join('')+'</div>';}).join('');}).join('')+'</div></section>'+footer(p);}
function renderMain(){const p=byId.get(state.page);const main=document.getElementById('page-content');let body='';if(p.view==='dashboard')body=dashboard(p);else if(p.view==='catalog')body=catalog(p);else if(p.view==='cart'||p.view==='bags')body=cart(p);else if(p.view==='requirement-form')body=requirementForm(p);else if(p.view==='settings')body=settings(p);else if(p.view==='backup')body=backup(p);else if(p.view==='profile')body=profile(p);else if(p.view==='login')body=login(p);else if(p.view==='reserved'||p.view==='register-closed')body=reserved(p);else if(p.view==='report')body=reports(p);else if(p.view==='help')body=help(p);else body=tablePage(p);main.innerHTML=heading(p)+body;document.title=p.label+' · 臻朴采购系统';}
function renderNav(){const scope=scopes.find(function(s){return s.id===state.scope;}),q=state.menuSearch.trim();document.getElementById('scope-selector').value=scope.id;let html='';scope.groups.forEach(function(g){const items=g.pages.filter(function(p){return !q||(p.label+g.label+p.summary).indexOf(q)!==-1;});if(!items.length)return;const key=scope.id+'/'+g.id,active=items.some(function(p){return p.id===state.page;}),expanded=!!q||state.open.has(key);html+='<div class="nav-group"><button class="group-toggle '+(active?'has-current':'')+'" data-group="'+key+'" aria-expanded="'+expanded+'" data-tip="'+esc(g.label)+'">'+icon(g.icon)+'<span class="nav-label">'+esc(g.label)+'</span>'+icon('chevron-right','chevron')+'</button>'+(expanded?'<div class="nav-children">'+items.map(function(p){return '<a class="nav-item '+(p.id===state.page?'active':'')+'" href="#'+p.id+'" '+(p.id===state.page?'aria-current="page"':'')+'><span>'+esc(p.label)+'</span>'+(p.phase==='pending'?'<span class="phase-mini">待定</span>':p.scope==='future'?'<span class="phase-mini">预留</span>':'')+'</a>';}).join('')+'</div>':'')+'</div>';});document.getElementById('sidebar-nav').innerHTML=html||'<div class="hint" style="padding:20px 10px;color:#9CAABA">没有匹配的菜单</div>';const count=scope.groups.reduce(function(n,g){return n+g.pages.length;},0);document.getElementById('scope-count').textContent=scope.label+' · '+count+' 个入口';}
function renderTabs(){document.getElementById('work-tabs').innerHTML=state.tabs.map(function(id){const p=byId.get(id);return '<div class="work-tab '+(id===state.page?'selected':'')+'"><button class="tab-main" data-page="'+id+'" role="tab" aria-selected="'+(id===state.page)+'" data-tip="'+esc(p.scopeLabel+' / '+p.label)+'">'+esc(p.label)+'</button>'+(id!=='admin-overview'?'<button class="tab-close" data-close-tab="'+id+'" aria-label="关闭'+esc(p.label)+'标签">×</button>':'')+'</div>';}).join('');}
function syncSidebarAccessibility(){const hidden=innerWidth<=720&&!document.body.classList.contains('menu-open');document.querySelector('.sidebar').inert=hidden;document.getElementById('sidebar-toggle').setAttribute('aria-expanded',String(innerWidth<=720?!hidden:!document.body.classList.contains('compact')));}
function activate(id,writeHash){if(!byId.has(id))id='admin-overview';const p=byId.get(id);state.page=id;if(state.scope!==p.scope){state.scope=p.scope;state.menuSearch='';document.getElementById('menu-search').value='';}state.open.add(p.scope+'/'+p.groupId);if(!state.tabs.includes(id))state.tabs.push(id);renderNav();renderTabs();renderMain();document.getElementById('breadcrumb').innerHTML='<span class="crumb-group">'+esc(p.scopeLabel)+' <span>/</span> </span><b>'+esc(p.label)+'</b>';document.getElementById('account-label').textContent=p.scope==='client'?'公司主账号':'管理员';document.getElementById('avatar-label').textContent=p.scope==='client'?'客':'管';document.querySelector('.top-right [data-page]').dataset.page=p.scope==='client'?'client-notifications':'admin-messages';document.body.classList.remove('menu-open');syncSidebarAccessibility();hideTip();if(writeHash!==false&&location.hash!=='#'+id)history.replaceState(null,'','#'+id);const selected=document.querySelector('.work-tab.selected');if(selected)selected.scrollIntoView({block:'nearest',inline:'nearest'});}
function readHash(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){id='admin-overview';}if(id==='page-content'){document.getElementById('page-content').focus();return;}activate(id||'admin-overview',false);}
function openModal(title,body){closeModal();const overlay=document.createElement('div');overlay.className='modal-overlay';overlay.innerHTML='<section class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="modal-head"><h2>'+esc(title)+'</h2><button class="icon-btn" data-close-modal aria-label="关闭详情">'+icon('close')+'</button></div><div class="modal-body">'+body+'</div></section>';openModal.trigger=document.activeElement;document.body.appendChild(overlay);document.body.style.overflow='hidden';overlay.addEventListener('click',function(e){if(e.target===overlay)closeModal();});overlay.querySelector('[data-close-modal]').focus();}
function closeModal(){const e=document.querySelector('.modal-overlay');if(e){e.remove();document.body.style.overflow='';if(openModal.trigger&&openModal.trigger.isConnected)openModal.trigger.focus();}}
function detail(id,i){const p=byId.get(id);if(/quotes/.test(id)){openModal('专业报价展示',quote(p));return;}const r=recordsFor(p)[i];let extra='';if(/orders/.test(id))extra='<div class="progress"><span class="done"></span><span class="done"></span><span></span><span></span></div>'+note('主订单统一汇总，购物袋按收件组拆分履约。发票状态独立展示。',true)+'<div class="reserved-links">'+pageLink('查看购物袋示例','client-bags','shopping-bag')+(p.scope==='client'?btn('再次下单','','data-repeat-order="true"','shopping-cart'):pageLink('查看配送记录','admin-dispatches','truck'))+'</div>';
if(/tracking|logistics/.test(id)){if(r.values.includes('商家自配送'))extra=note('由商家自行送达，无快递单号。此记录展示配送人员、送达状态与客户确认信息，不展示快递轨迹。',true)+'<div class="summary-row"><span>配送方式</span><span>商家自配送</span></div><div class="summary-row"><span>配送联系人</span><span>配送员（示例）</span></div><div class="summary-row"><span>客户确认</span><span>'+esc(r.values[r.values.length-1])+'</span></div>';else extra='<ul class="tracking-list"><li><strong>配送中（演示）</strong><time>2026-11-14 10:30 · 示例状态</time></li><li><strong>商品已发出（演示）</strong><time>2026-11-13 15:20 · 示例状态</time></li></ul>'+note('这里不请求真实物流接口。快递签收后仍需客户确认货物无问题。',true);}
openModal(p.label+' · 示例详情','<dl class="detail-grid">'+p.columns.map(function(c,j){return '<div><dt>'+esc(c)+'</dt><dd>'+esc(r.values[j])+'</dd></div>';}).join('')+'</dl>'+extra+notes(p));}
function productDetail(i){const p=products[i];openModal('商品详情','<div class="quote-product" style="align-items:flex-start"><div class="product-visual" style="width:160px;height:160px;border-radius:9px;flex-shrink:0">'+icon(p.icon)+'</div><div><h2 style="margin:0 0 10px;font-size:19px">'+esc(p.name)+'</h2><p class="hint">商品编码：'+p.sku+'</p><p class="hint">'+esc(p.spec)+'</p><p style="color:var(--primary);font-size:18px">待报价</p>'+btn('加入采购购物车','primary','data-demo="加入采购购物车"','shopping-cart')+'</div></div><p class="hint" style="margin-top:25px">展示商品标题、规格、图片和对客说明。此处不包含后台采购成本、供应商来源链接或内部备注。</p>');}
function updateList(){const p=byId.get(state.page),rows=filteredRows(p),body=document.getElementById('list-body');if(body)body.innerHTML=tableRows(p,rows);const count=document.getElementById('list-count');if(count)count.textContent='共 '+rows.length+' 条示例记录';}
document.addEventListener('click',function(e){const t=e.target.closest('button,a');if(!t)return;
if(t.hasAttribute('data-page')){e.preventDefault();closeModal();activate(t.dataset.page);return;}
if(t.hasAttribute('data-group')){if(document.body.classList.contains('compact')&&innerWidth>720){document.body.classList.remove('compact');document.getElementById('sidebar-toggle').setAttribute('aria-expanded','true');}state.open.has(t.dataset.group)?state.open.delete(t.dataset.group):state.open.add(t.dataset.group);renderNav();return;}
if(t.hasAttribute('data-close-tab')){const id=t.dataset.closeTab,pos=state.tabs.indexOf(id);state.tabs=state.tabs.filter(function(x){return x!==id;});if(state.page===id)activate(state.tabs[Math.max(0,pos-1)]||'admin-overview');else renderTabs();return;}
if(t.hasAttribute('data-sub')){state.sub[state.page]=t.dataset.sub;renderMain();return;}
if(t.hasAttribute('data-detail')){detail(t.dataset.detail,Number(t.dataset.row));return;}
if(t.hasAttribute('data-product')){e.preventDefault();productDetail(Number(t.dataset.product));return;}
if(t.hasAttribute('data-close-modal')){closeModal();return;}
if(t.hasAttribute('data-reset')){state.search[state.page]='';state.sub[state.page]=byId.get(state.page).tabs[0];renderMain();return;}
if(t.hasAttribute('data-range')){state.range=t.dataset.range;if(state.range!=='自定义'){DATES.start=state.range==='本周'?'2026-11-09':'2026-11-01';DATES.end='2026-11-14';}renderMain();return;}
if(t.hasAttribute('data-qty')){const i=Number(t.dataset.qty);state.cartQty[i]=Math.max(1,state.cartQty[i]+Number(t.dataset.delta));renderMain();return;}
if(t.hasAttribute('data-repeat-order')){closeModal();activate('client-cart');toast('已进入示例购物车，可调整数量与收货分组；不会直接生成订单。');return;}
if(t.hasAttribute('data-switch')){const on=t.getAttribute('aria-checked')!=='true';t.setAttribute('aria-checked',String(on));t.classList.toggle('on',on);toast('已切换展示状态，配置不会保存。');return;}
if(t.hasAttribute('data-demo')){e.preventDefault();toast('“'+t.dataset.demo+'”为界面展示入口，本页不会提交或保存实际业务。');return;}
});
document.addEventListener('input',function(e){if(e.target.id==='menu-search'){state.menuSearch=e.target.value;renderNav();}if(e.target.id==='list-search'){state.search[state.page]=e.target.value;updateList();}if(e.target.id==='catalog-search'){state.search[state.page]=e.target.value;document.getElementById('product-grid').innerHTML=productCards(e.target.value);}});
document.addEventListener('change',function(e){if(e.target.id==='range-start'||e.target.id==='range-end'){DATES[e.target.id==='range-start'?'start':'end']=e.target.value;state.range='自定义';document.querySelectorAll('[data-range]').forEach(function(b){b.classList.toggle('active',b.dataset.range==='自定义');});toast('日期选择仅演示交互，示例统计数据不随查询变化。');}});
document.addEventListener('submit',function(e){e.preventDefault();toast('当前为静态界面预览，不提交表单。');});
document.getElementById('scope-selector').addEventListener('change',function(e){activate(scopes.find(function(s){return s.id===e.target.value;}).groups[0].pages[0].id);});
document.getElementById('sidebar-toggle').addEventListener('click',function(){if(innerWidth<=720){document.body.classList.toggle('menu-open');syncSidebarAccessibility();}else{document.body.classList.toggle('compact');syncSidebarAccessibility();}});
document.getElementById('nav-backdrop').addEventListener('click',function(){document.body.classList.remove('menu-open');syncSidebarAccessibility();});
let tipTimer,tipTarget,tipEl;
function hideTip(){clearTimeout(tipTimer);if(tipEl){tipEl.remove();tipEl=null;}tipTarget=null;}
function showTip(t){hideTip();tipTarget=t;tipTimer=setTimeout(function(){if(!t.isConnected)return;tipEl=document.createElement('div');tipEl.className='tooltip';tipEl.setAttribute('role','tooltip');tipEl.textContent=t.dataset.tip;document.body.appendChild(tipEl);const r=t.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight;tipEl.style.left=Math.max(10,Math.min(innerWidth-w-10,r.left+r.width/2-w/2))+'px';tipEl.style.top=(r.bottom+h+12<innerHeight?r.bottom+7:Math.max(8,r.top-h-7))+'px';},420);}
document.addEventListener('mouseover',function(e){const t=e.target.closest('[data-tip]');if(t&&t!==tipTarget)showTip(t);});
document.addEventListener('mouseout',function(e){if(tipTarget&&!tipTarget.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',function(e){if(e.target.matches('[data-tip]'))showTip(e.target);});
document.addEventListener('focusout',hideTip);
document.addEventListener('scroll',hideTip,true);
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();hideTip();document.body.classList.remove('menu-open');syncSidebarAccessibility();}const m=document.querySelector('.modal');if(m&&e.key==='Tab'){const f=Array.from(m.querySelectorAll('button,a[href],input,select,textarea,[tabindex="0"]')).filter(function(x){return !x.disabled;});if(f.length&&e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus();}else if(f.length&&!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus();}}});
window.addEventListener('hashchange',readHash);
window.addEventListener('resize',syncSidebarAccessibility);
readHash();
</script>
</body>
</html>
